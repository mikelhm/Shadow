apply plugin: 'kotlin'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api "com.android.tools.build:gradle:$build_gradle_version"
    api "com.android.tools:common:$android_build_tools_version"
    api "org.javassist:javassist:$javassist_version"
    api gradleApi()
    testImplementation "junit:junit:$junit_version"
    testImplementation "commons-io:commons-io:$commons_io_jvm_version"
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

task testJar(type: Jar, dependsOn: testClasses) {
    // 将 baseName 替换为 archiveBaseName
    archiveBaseName.set("test-${project.name}")
//    baseName = "test-${project.archivesBaseName}"
    from sourceSets.test.output
}

configurations {
    tests
}

artifacts {
    tests testJar
}
